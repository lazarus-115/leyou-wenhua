<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乐游文华 · 校园任务巡游</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <div class="leaf-field" id="leafField"></div>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="images/logo.png" alt="团学标志">
        <span>乐游<em>文华</em></span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="guide.html">流程向导</a>
        <a href="overview.html">任务总览</a>
        <a href="map.html" class="map-entry">🗺 校园地图</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <img class="deco-leaf deco-1" src="images/maple-leaf.png" alt="">
      <img class="deco-leaf deco-2" src="images/maple-leaf.png" alt="">
      <img class="deco-leaf deco-3" src="images/maple-leaf.png" alt="">
      <div class="container">
        <span class="badge" id="heroBadge"></span>
        <h1 id="heroTitle">乐游文华</h1>
        <p class="slogan" id="heroSlogan">游戏任务 · 校园巡游</p>
        <p class="intro" id="heroIntro"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="guide.html">开始旅程 →</a>
          <a class="btn btn-ghost" href="overview.html">查看任务总览</a>
        </div>
        <div class="info-strip" id="infoStrip"></div>
      </div>
    </section>

    <section class="section lottery" id="lottery">
      <div class="container">
        <h2 class="section-title">抽取你的专属路线</h2>
        <p class="section-sub">转一转，随机抽出一条巡游路线</p>
        <div class="wheel-wrap">
          <div class="wheel-pointer">▼</div>
          <div class="wheel" id="wheel"></div>
          <button class="btn btn-primary wheel-btn" id="spinBtn">🎯 开始抽取</button>
        </div>
        <p class="wheel-hint">抽中后，流程向导会按这条路线的顺序带你闯关</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="section-title">怎么玩？</h2>
        <p class="section-sub">三步上手，跟着红枫走就对了</p>
        <div class="features">
          <div class="feature">
            <div class="f-ico">🎫</div>
            <h3>领取任务卡</h3>
            <p>在校门广场集合，领取任务卡与校园地图，开启旅程。</p>
          </div>
          <div class="feature">
            <div class="f-ico">🎯</div>
            <h3>按序闯关</h3>
            <p>沿着路线完成一个个游戏任务，边玩边赏校园风景。</p>
          </div>
          <div class="feature">
            <div class="f-ico">🏆</div>
            <h3>集章兑奖</h3>
            <p>集齐印章，到终点兑换专属奖品与完赛证书。</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="text-align:center">
      <a class="btn btn-primary" href="guide.html">立即开始闯关 →</a>
    </section>
  </main>

  <footer class="footer">
    <div class="leaf-icon f-leaf"></div>
    <p>乐游文华 · 文华学院</p>
    <p id="footDate"></p>
  </footer>

  <!-- 抽取结果弹窗 -->
  <div class="modal" id="resultModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <div class="modal-emoji" id="modalEmoji">🍁</div>
      <h3 class="modal-title">你抽到了</h3>
      <div class="modal-route" id="modalRoute">枫红之路</div>
      <p class="modal-order" id="modalOrder"></p>
      <div class="modal-actions">
        <a class="btn btn-primary" id="goRoute" href="guide.html">进入这条路线 →</a>
        <button class="btn btn-ghost" id="reSpin">再抽一次</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
