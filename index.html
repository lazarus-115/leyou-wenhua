<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e2383a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="images/logo.png">
  <title>乐游文华 · 校园任务巡游</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <div class="leaf-field" id="leafField"></div>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="images/logo.png" alt="团学标志">
        <span>乐游<em>文华</em></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="active">首页</a>
        <a href="guide.html">流程向导</a>
        <a href="overview.html">任务总览</a>
        <a href="map.html" class="map-entry">🗺 校园地图</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <img class="deco-leaf deco-1" src="images/maple-leaf.png" alt="">
      <img class="deco-leaf deco-2" src="images/maple-leaf.png" alt="">
      <img class="deco-leaf deco-3" src="images/maple-leaf.png" alt="">
      <div class="container">
        <span class="badge" id="heroBadge"></span>
        <h1 id="heroTitle">乐游文华</h1>
        <p class="slogan" id="heroSlogan">游戏任务 · 校园巡游</p>
        <p class="intro" id="heroIntro"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#routes">选择路线 →</a>
          <a class="btn btn-ghost" href="overview.html">查看任务总览</a>
        </div>
        <div class="info-strip" id="infoStrip"></div>
      </div>
    </section>

    <section class="section routes" id="routes">
      <div class="container">
        <h2 class="section-title">五条巡游路线</h2>
        <p class="section-sub">选择一条路线，跟着顺序闯关集章</p>
        <div class="route-list" id="routeList"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="section-title">怎么玩？</h2>
        <p class="section-sub">三步上手，跟着红枫走就对了</p>
        <div class="features">
          <div class="feature">
            <div class="f-ico">🎫</div>
            <h3>组队集结</h3>
            <p>活动当天组队集合，领取集章卡，从五条路线中选择一条开启旅程。</p>
          </div>
          <div class="feature">
            <div class="f-ico">🎯</div>
            <h3>按路线闯关</h3>
            <p>沿所选路线依次前往 5 个游戏点位，完成挑战集齐印章。</p>
          </div>
          <div class="feature">
            <div class="f-ico">🏆</div>
            <h3>集章评比</h3>
            <p>集齐 5 枚印章前往主席台合影，凭闯关表现参与评比赢取奖品。</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="text-align:center">
      <a class="btn btn-primary" href="#routes">选择路线开始闯关 →</a>
    </section>
  </main>

  <footer class="footer">
    <div class="leaf-icon f-leaf"></div>
    <p>乐游文华 · 文华学院</p>
    <p id="footDate"></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
